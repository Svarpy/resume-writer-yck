[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-writer"
version = "4.0.0"
description = "Resume Writer: API server, desktop app and MCP server that generate Word resumes from a sample format."
requires-python = ">=3.10"
# resume_core: the document engine (OOXML parser + generator + settings schema), needed by everything.
dependencies = ["python-docx>=1.2.0"]

[project.optional-dependencies]
# Server: FastAPI + MongoDB. The only component that needs database credentials.
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pymongo>=4.6", "bcrypt>=4.0.0", "PyJWT>=2.8",
          "python-multipart>=0.0.9", "python-dotenv>=1.0"]
# Client library shared by the desktop app and the MCP server.
client = ["httpx>=0.27", "python-dotenv>=1.0"]
# Desktop app (Tkinter ships with Python).
gui = ["httpx>=0.27", "python-dotenv>=1.0", "certifi>=2024.0.0"]
# MCP server for AI apps such as Claude.
mcp = ["httpx>=0.27", "python-dotenv>=1.0", "mcp>=2.0"]
all = ["resume-writer[server,client,gui,mcp]"]
dev = ["resume-writer[all]", "mongomock>=4.1", "pyflakes"]

[project.scripts]
resume-writer-server = "resume_server.__main__:main"
resume-writer-gui = "resume_gui.__main__:main"
resume-writer-mcp = "resume_mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["resume_core*", "resume_server*", "resume_client*", "resume_gui*", "resume_mcp*"]
